name: VicarV3

services:
  db:
    image: postgres:15
    container_name: vicarv3_db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "15430:5432"
    volumes:
      - .data/db:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vicarv3_redis
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASS}
    ports:
      - "16380:6379"
    volumes:
      - .data/redis:/data